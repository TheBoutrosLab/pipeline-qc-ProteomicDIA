  - name: test-integration-Epifany
    message: Summarize two DIA runs and cohort Epifany groups
    nf_script: main.nf
    nf_config: test/test-integration-Epifany/test.config
    verbose: true
  - name: test-integration-ProtLoom
    message: Summarize two DIA runs and cohort ProtLoom groups
    nf_script: main.nf
    nf_config: test/test-integration-ProtLoom/test.config
    verbose: true
  - name: test-integration-HeLa-ProteinProphet
    message: Summarize HeLa dia-PASEF acquisition and cohort ProteinProphet outputs
    nf_script: main.nf
