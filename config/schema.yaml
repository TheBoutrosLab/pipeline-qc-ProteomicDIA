---
dataset_id:
  type: 'String'
  required: true
  help: 'Cohort identifier'
mzml_csv:
  type: 'Path'
  mode: 'r'
  required: true
  help: 'CSV with sample_name,fraction_id,path and optional acquisition_path (.mzML or Bruker .d); one row per sample/fraction pair'
search_idxml_csv:
  type: 'Path'
  mode: 'r'
  required: true
  help: 'Metapipeline validation.csv with sample_name,search_engine,idXML'
filtered_idxml_csv:
  type: 'Path'
  mode: 'r'
  required: true
  help: 'CSV with sample_name,idXML for final filtered validation results'
psm_features_csv:
  type: 'Path'
  mode: 'r'
  required: false
  help: 'Optional sample_name,search_engine,route,fraction_id,path manifest for published MSBooster PIN or PSMFeatureExtractor idXML files'
inference_route:
  type: 'String'
  choices: ['ProteinProphet', 'Fido', 'Epifany', 'ProtLoom']
  required: true
  help: 'Selected cohort protein inference route'
protein_groups:
  type: 'Path'
  mode: 'r'
  required: true
  help: 'Cohort group idXML, Fido JSON, or ProtLoom sample-groups CSV'
library_tsv:
  type: 'Path'
  mode: 'r'
  required: true
  help: 'EasyPQP library TSV'
export_summary_tsv:
  type: 'Path'
  mode: 'r'
  required: true
  help: 'Validation EasyPQP export summary TSV'
diann_report:
  type: 'Path'
  mode: 'r'
  required: true
  help: 'Final aggregated DIA-NN report TSV'
output_dir:
  type: 'Path'
  mode: 'w'
  required: true
  help: 'Root output directory'
docker_image_plotly:
  type: 'String'
  required: false
  help: 'Public image with Plotly installed; defaults to multiqc/multiqc:v1.35'
pyopenms_version:
  type: 'String'
  required: false
  help: 'Lab pyOpenMS container version'
work_dir:
  type: 'Path'
  mode: 'w'
  required: false
  help: 'Nextflow work directory'
base_resource_update:
  type: 'ResourceUpdateNamespace'
  required: false
  help: 'Process resource overrides'
  elements:
    memory:
      type: 'ResourceUpdateList'
      required: false
    cpus:
      type: 'ResourceUpdateList'
      required: false
